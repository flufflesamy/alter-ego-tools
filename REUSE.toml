version = 1

# GPL-3.0-or-later — Amy Poon (original source code and assets)
[[annotations]]
path = [
    "src/**/*.rs",
    "data/resources/**",
    "README.md",
]
SPDX-FileCopyrightText = "2026 Amy Poon <amy@amypoon.me>"
SPDX-License-Identifier = "GPL-3.0-or-later"

# GPL-3.0-or-later — Bilal Elmoussaoui & Amy Poon (template-derived, substantially modified)
[[annotations]]
path = [
    ".*/workflows/ci.yml",
]
precedence = "override"
SPDX-FileCopyrightText = [
    "2019 Bilal Elmoussaoui",
    "2026 Amy Poon <amy@amypoon.me>"
]
SPDX-License-Identifier = "GPL-3.0-or-later"

# GPL-3.0-or-later — Translation Authors (translation files)
[[annotations]]
path = "po/**.po"
SPDX-FileCopyrightText = "2026 Translation Authors"
SPDX-License-Identifier = "GPL-3.0-or-later"

# CC0-1.0 — Amy Poon (metadata)
[[annotations]]
path = [
    "build-aux/**.json",
    "data/**.in",
    "po/LINGUAS",
    "po/*.in",
    "alter-ego-tools.doap",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Amy Poon <amy@amypoon.me>"
SPDX-License-Identifier = "CC0-1.0"

# CC0-1.0 — NONE (generated files)
[[annotations]]
path = ["Cargo.lock", "subprojects/*.wrap", "data/resources/icons/*.svg"]
SPDX-FileCopyrightText = "NONE"
SPDX-License-Identifier = "CC0-1.0"

# LicenseRef-gtk-rust-template — Bilal Elmoussaoui (unmodified template boilerplate)
# https://gitlab.gnome.org/World/Rust/gtk-rust-template
[[annotations]]
path = [".editorconfig", ".gitignore", "meson_options.txt", "data/icons/*.svg"]
SPDX-FileCopyrightText = "2019 Bilal Elmoussaoui"
SPDX-License-Identifier = "LicenseRef-gtk-rust-template"
