version = 1

# Source Code and Assets
[[annotations]]
path = [
    "src/**/*.rs",
    "data/resources/**",
]
SPDX-FileCopyrightText = "2026 Amy Poon <amy@amypoon.me>"
SPDX-License-Identifier = "GPL-3.0-or-later"

# Translation Files
[[annotations]]
path = "po/**.po"
SPDX-FileCopyrightText = "2026 Translation Authors"
SPDX-License-Identifier = "GPL-3.0-or-later"

# Metadata
[[annotations]]
path = [
    "build-aux/**.json",
    "data/**.in",
    "po/LINGUAS",
    "po/*.in",
    "alter-ego-tools.doap",
    "com.flufflesamy.AlterEgoTools.flatpakref"
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Amy Poon <amy@amypoon.me>"
SPDX-License-Identifier = "CC0-1.0"

# Generated Files
[[annotations]]
path = ["Cargo.lock", "subprojects/*.wrap", "data/resources/icons/*.svg"]
SPDX-FileCopyrightText = "NONE"
SPDX-License-Identifier = "CC0-1.0"

# LicenseRef-gtk-rust-template — Bilal Elmoussaoui
# https://gitlab.gnome.org/World/Rust/gtk-rust-template
[[annotations]]
path = [".editorconfig", ".gitignore", "meson_options.txt", "data/icons/*.svg"]
SPDX-FileCopyrightText = "2019 Bilal Elmoussaoui"
SPDX-License-Identifier = "LicenseRef-gtk-rust-template"
