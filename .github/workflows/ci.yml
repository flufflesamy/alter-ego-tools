on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

name: CI

permissions:
  contents: read

jobs:
  rustfmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy_check:
    name: Clippy
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: "-Dwarnings"
    steps:
      - uses: actions/checkout@v6
      - name: Run Clippy
        run: cargo clippy --all-targets --all-features

  flatpak:
    name: Flatpak (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Development
            profile: development
            manifest: build-aux/com.flufflesamy.AlterEgoTools.Devel.json
            bundle: alter-ego-tools-devel.flatpak
          - name: Release
            profile: release
            manifest: build-aux/com.flufflesamy.AlterEgoTools.json
            bundle: alter-ego-tools.flatpak
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - uses: actions/checkout@v6
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: ${{ matrix.bundle }}
          manifest-path: ${{ matrix.manifest }}
          run-tests: true
          cache-key: flatpak-builder-${{ matrix.profile }}-${{ hashFiles('build-aux/**',
            'Cargo.lock') }}
